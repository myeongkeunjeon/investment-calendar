# 매일 자동으로 투자 일정 캘린더를 새로 만들고 GitHub Pages에 올린다.
name: 투자 캘린더 갱신

on:
  schedule:
    - cron: "17 22 * * *"   # 매일 한국시간 오전 7:17 (UTC 22:17)
  workflow_dispatch:         # Actions 화면의 "Run workflow" 버튼으로 바로 실행
  push:
    branches: [main]
    paths:
      - "build_calendar.py"
      - "data/themes.json"
      - "data/names_ko.json"
      - "docs/index.html"
      - "docs/manifest.webmanifest"
      - ".github/workflows/update-calendar.yml"

permissions:
  contents: write   # 갱신된 일정 데이터를 저장소에 저장
  pages: write      # GitHub Pages에 올리기
  id-token: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 프로그램 준비
        run: pip install -r requirements.txt

      - name: 검사(테스트)
        run: python -m unittest discover tests

      - name: 캘린더 만들기
        run: python build_calendar.py

      - name: 갱신된 데이터 저장
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 실행이 겹치면 그 사이 main이 바뀌어 있을 수 있다. 만든 파일만 따로 두고
          # 최신 main 위에 다시 올려서 저장한다 (충돌 방지).
          OUT="$RUNNER_TEMP/generated"
          mkdir -p "$OUT"
          FILES="docs/calendar.ics docs/events.json docs/companies.json docs/market.json docs/fx.json data/sp100.json"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$OUT/$(basename "$f")"; done
          git fetch origin main
          git checkout -f -B main origin/main
          for f in $FILES; do [ -f "$OUT/$(basename "$f")" ] && cp "$OUT/$(basename "$f")" "$f"; done
          git add $FILES 2>/dev/null || git add docs data
          if git diff --cached --quiet; then
            echo "바뀐 일정이 없습니다."
          else
            git commit -m "캘린더 자동 갱신 $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
