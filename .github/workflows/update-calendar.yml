# 매일 자동으로 투자 일정 캘린더를 새로 만들고 GitHub Pages에 올린다.
name: 투자 캘린더 갱신

on:
  schedule:
    - cron: "17 22 * * *"   # 매일 한국시간 오전 7:17 (UTC 22:17) — 새벽(장 후) 발표 결과 반영
    - cron: "47 14 * * *"   # 매일 한국시간 밤 11:47 (UTC 14:47) — 저녁(장 전) 발표 결과 반영
  workflow_dispatch:         # Actions 화면의 "Run workflow" 버튼으로 바로 실행
  push:
    branches: [main]
    paths:
      - "build_calendar.py"
      - "data/themes.json"
      - "data/names_ko.json"
      - "data/bok_meetings.json"
      - "docs/index.html"
      - "docs/manifest.webmanifest"
      - ".github/workflows/update-calendar.yml"

permissions:
  contents: write   # 갱신된 일정 데이터를 저장소에 저장
  pages: write      # GitHub Pages에 올리기
  id-token: write

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 프로그램 준비
        run: pip install -r requirements.txt

      - name: 검사(테스트)
        run: python -m unittest discover tests

      - name: 캘린더 만들기
        run: python build_calendar.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}  # 선택: BLS가 막힐 때 CPI·고용 일정을 받는 대체 경로

      - name: 갱신된 데이터 저장
        if: github.ref == 'refs/heads/main'
        continue-on-error: true   # 저장이 실패해도 앱에는 새 데이터를 올린다
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 실행이 겹치면 그 사이 main이 바뀌어 있을 수 있다. 만든 파일만 따로 두고
          # 최신 main 위에 다시 올려서 저장한다 (충돌 방지).
          OUT="$RUNNER_TEMP/generated"
          mkdir -p "$OUT"
          FILES="docs/calendar.ics docs/events.json docs/companies.json docs/market.json docs/fx.json docs/dividends.json data/sp100.json data/sp500.json data/macro_schedule.json data/bok_rate_history.json data/reactions.json data/timings.json"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$OUT/$(basename "$f")"; done
          # GitHub 서버가 잠깐 오류를 낼 수 있어 몇 번 다시 시도한다
          for attempt in 1 2 3 4; do
            git fetch origin main
            git checkout -f -B main origin/main
            for f in $FILES; do [ -f "$OUT/$(basename "$f")" ] && cp "$OUT/$(basename "$f")" "$f"; done
            git add $FILES 2>/dev/null || git add docs data
            if git diff --cached --quiet; then
              echo "바뀐 일정이 없습니다."
              exit 0
            fi
            git commit -m "캘린더 자동 갱신 $(date -u +%Y-%m-%d)"
            if git push origin HEAD:main; then exit 0; fi
            echo "저장 실패 ($attempt번째) → $((attempt * 15))초 뒤 다시 시도"
            sleep $((attempt * 15))
          done
          echo "::warning::데이터를 저장소에 저장하지 못했어요. 앱에는 이번 데이터가 올라가고, 다음 실행에서 다시 저장해요."
          exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
